name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest


    # Baza testowa uruchamiana obok joba (tylko na czas joba, jednorazowy kontener).
    # Dane logowania dotyczą wyłącznie tego tymczasowego kontenera - nie są sekretem żadnego środowiska.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: room_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d room_booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # tests/setupEnv.js używa tej wartości zamiast domyślnej
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/room_booking_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22 (cache npm)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (unit + integration)
        run: npm test

      - name: Verify Docker image builds
        run: docker build -t room-booking-api:ci .
